<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Plot Details | PROBRIDGE</title>
    <meta name="description" content="Plot details, price, amenities and location. Zero brokerage with PROBRIDGE." />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <meta property="og:image" content="https://www.probridge.co.in/assets/probridge-og.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/site.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="wrap" id="main" style="padding: 30px 0 60px"></main>
    <div id="site-footer"></div>

    <script src="assets/plots-data.js"></script>
    <script src="assets/site.js"></script>
    <script>
      const el = document.getElementById("main");
      const p = PLOTS.find((x) => x.id === new URLSearchParams(location.search).get("id"));

      if (!p) {
        el.innerHTML = `<div class="empty"><h2>Plot not found</h2>
          <p class="muted">This listing may have been removed.</p><br>
          <a class="btn gold-btn" href="plots.html">Browse all plots</a></div>`;
      } else {
        document.title = `${p.name}, ${p.locality} | Plots for Sale in Chennai | PROBRIDGE`;
        const i = PLOTS.indexOf(p);
        const fact = (label, value) => (value ? `<div><small>${label}</small><b>${value}</b></div>` : "");
        const list = (items) => `<ul class="pills">${items.map((a) => `<li>${a}</li>`).join("")}</ul>`;
        const related = PLOTS.filter((x) => x !== p)
          .sort((a, b) => (b.locality === p.locality) - (a.locality === p.locality))
          .slice(0, 3);
        const sections = [
          ["overview", "Overview"],
          p.amenities && ["amenities", "Amenities"],
          p.features && ["features", "Features"],
          p.distances && ["distances", "Distances"],
          ["location", "Location"]
        ].filter(Boolean);

        el.innerHTML = `
          <div class="crumbs"><a href="index.html">Home</a> › <a href="plots.html">Plots</a> ›
            <a href="plots.html?loc=${encodeURIComponent(p.locality)}">${p.locality}</a> › ${p.name}</div>
          <div class="detail-hero" style="background-image:url('${img(i, 1600)}')"><span class="badge">${p.status}</span></div>

          <div class="detail-grid">
            <div>
              <div class="detail-title">
                <div>
                  <h1>${p.name}</h1>
                  <p class="muted with-ico">${icon("pin", 16)} ${p.locality}, Chennai · By ${p.builder}</p>
                  ${p.approval ? `<p class="rera">${icon("shield", 16)} ${p.approval}</p>` : ""}
                </div>
                <div><small class="muted">Starting price</small><div class="price">${price(p)}</div></div>
              </div>

              <nav class="tabs">${sections.map(([id, t]) => `<a href="#${id}">${t}</a>`).join("")}</nav>

              <div class="block" id="overview">
                <h2>Overview</h2>
                <div class="facts">
                  ${fact("Price", price(p))}
                  ${fact("Plot sizes", p.sizeMin && size(p))}
                  ${fact("Project area", p.acres && p.acres + " acres")}
                  ${fact("Price / sq.ft", p.rate && "₹" + p.rate.toLocaleString("en-IN"))}
                  ${fact("Facing", p.facing)}
                  ${fact("Status", p.status)}
                  ${fact("Developer", p.builder)}
                </div>
                ${p.about ? `<p>${p.about}</p>` : ""}
              </div>
              ${p.amenities ? `<div class="block" id="amenities"><h2>Amenities</h2>${list(p.amenities)}</div>` : ""}
              ${p.features ? `<div class="block" id="features"><h2>Features</h2>${list(p.features)}</div>` : ""}
              ${p.distances ? `<div class="block" id="distances"><h2>Distances</h2><table class="dist">
                ${p.distances.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("")}</table></div>` : ""}
              <div class="block" id="location">
                <h2>Location</h2>
                <iframe class="map" loading="lazy" title="Map of ${p.locality}"
                  src="https://maps.google.com/maps?q=${encodeURIComponent(p.locality + ", Chennai")}&z=13&output=embed"></iframe>
              </div>
              <div class="block cta-row">
                <button class="btn gold-btn" data-enquire="${p.name}">Enquire Now</button>
                <button class="btn" data-enquire="${p.name}" data-need="Schedule site visit">Schedule Site Visit</button>
              </div>
            </div>

            <aside class="side">
              <div class="panel">
                <h2 style="font-size:22px">Interested in ${p.name}?</h2>
                <p class="muted">Get price details and a site visit. Zero brokerage.</p>
                ${enquiryForm({ project: p.name })}
                <a class="btn full" style="margin-top:10px" href="tel:${SITE.tel}">${icon("phone", 18)} Call ${SITE.phone}</a>
              </div>
            </aside>
          </div>

          <section style="padding-bottom:0">
            <div class="head"><h2>Similar plots</h2><a class="link" href="plots.html">View all ${icon("arrow", 16)}</a></div>
            <div class="grid">${related.map(plotCard).join("")}</div>
          </section>`;
      }
    </script>
  </body>
</html>
