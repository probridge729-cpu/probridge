<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Plots for Sale in Chennai | PROBRIDGE</title>
    <meta
      name="description"
      content="Search approved plots for sale in Chennai by locality and budget. Zero brokerage with PROBRIDGE."
    />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <meta property="og:title" content="Plots for Sale in Chennai | PROBRIDGE" />
    <meta property="og:image" content="https://www.probridge.co.in/assets/probridge-og.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/site.css" />
  </head>
  <body>
    <div id="site-header"></div>

    <main id="main">
      <div class="page-head">
        <div class="wrap">
          <div class="crumbs"><a href="index.html">Home</a> › Plots</div>
          <h1>Plots for Sale in Chennai</h1>
          <p class="muted">Approved plotted developments. Zero brokerage.</p>

          <form class="filters" id="filters" role="search">
            <input name="q" placeholder="Search project, builder or locality" aria-label="Search" />
            <select name="loc" aria-label="Locality"><option value="">All localities</option></select>
            <select name="min" aria-label="Minimum budget">
              <option value="">Min budget</option>
              <option value="25">₹25 L</option>
              <option value="50">₹50 L</option>
              <option value="75">₹75 L</option>
              <option value="100">₹1 Cr</option>
            </select>
            <select name="max" aria-label="Maximum budget">
              <option value="">Max budget</option>
              <option value="50">₹50 L</option>
              <option value="75">₹75 L</option>
              <option value="100">₹1 Cr</option>
              <option value="150">₹1.5 Cr</option>
              <option value="250">₹2.5 Cr</option>
            </select>
            <select name="sort" aria-label="Sort">
              <option value="">Sort: Featured</option>
              <option value="low">Price: Low to High</option>
              <option value="high">Price: High to Low</option>
            </select>
            <button class="btn gold-btn">Search</button>
          </form>
        </div>
      </div>

      <section>
        <div class="wrap">
          <div class="result-bar">
            <b id="count"></b>
            <a href="plots.html" class="link">Clear filters</a>
          </div>
          <div class="grid" id="results"></div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>
    <script src="assets/plots-data.js"></script>
    <script src="assets/site.js"></script>
    <script>
      const form = document.getElementById("filters");
      form.loc.innerHTML += [...new Set(PLOTS.map((p) => p.locality))]
        .map((l) => `<option>${l}</option>`)
        .join("");

      const params = new URLSearchParams(location.search);
      for (const [k, v] of params) if (form[k]) form[k].value = v;

      const q = (params.get("q") || "").toLowerCase().trim();
      const loc = params.get("loc");
      const min = +params.get("min") || 0;
      const max = +params.get("max") || Infinity;

      // A plot matches a budget when its price range overlaps it.
      let list = PLOTS.filter(
        (p) =>
          (!q || [p.name, p.builder, p.locality].join(" ").toLowerCase().includes(q)) &&
          (!loc || p.locality === loc) &&
          (p.max || p.min) >= min &&
          p.min <= max
      );
      const sort = params.get("sort");
      if (sort) list = [...list].sort((a, b) => (sort === "low" ? a.min - b.min : b.min - a.min));

      document.getElementById("count").textContent =
        `${list.length} plot${list.length === 1 ? "" : "s"} found${loc ? " in " + loc : ""}`;
      document.getElementById("results").innerHTML = list.length
        ? list.map(plotCard).join("")
        : `<div class="empty" style="grid-column:1/-1">
             <h3>No plots match your search yet.</h3>
             <p class="muted">Tell us what you need and we'll find it for you.</p><br>
             <button class="btn gold-btn" data-enquire>Post Your Requirement</button>
           </div>`;
    </script>
  </body>
</html>
